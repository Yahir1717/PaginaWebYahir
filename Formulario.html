<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro | Conciencia Histórica II</title>

    <link rel="stylesheet" href="disenioPagina.css">

    <script src="app.js" defer></script>

</head>

<body>

    <header class="header">

        <nav class="navbar container">

            <a href="index.html" class="logo">

                <span class="logo-icon">H</span>

                <span>
                    CONCIENCIA
                    <small>HISTÓRICA II</small>
                </span>

            </a>

            <ul class="nav-links">

                <li><a href="index.html">Inicio</a></li>

                <li><a href="Pagina1.html">Historia</a></li>

            </ul>

        </nav>

    </header>


    <main>

        <section class="form-section">

            <article class="form-card">

                <span class="section-tag">
                    BIENVENIDO
                </span>

                <h1>Registro de usuario</h1>

                <p>
                    Ingresa tus datos para comenzar
                    el recorrido por la historia de México.
                </p>


                <div id="mensajeError" class="alert alert-error"
                    role="alert"></div>

                <div id="mensajeExito" class="alert alert-success"
                    role="status"></div>


                <form id="formRegistro">

                    <div class="form-group">

                        <label for="nombre">
                            Nombre completo:
                        </label>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Escribe tu nombre completo"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="grupo">
                            Grupo:
                        </label>

                        <input
                            type="text"
                            id="grupo"
                            name="grupo"
                            placeholder="Ejemplo: 3B"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="correo">
                            Correo electrónico:
                        </label>

                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="ejemplo@correo.com"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="telefono">
                            Teléfono:
                        </label>

                        <input
                            type="tel"
                            id="telefono"
                            name="telefono"
                            placeholder="Ingresa tu teléfono"
                            required
                            pattern="[0-9]{10}"
                            maxlength="10">

                    </div>


                    <button type="submit">
                        Registrarme y continuar →
                    </button>

                </form>

                <br>

                <a href="index.html" class="text-link">
                    ← Regresar al inicio
                </a>

            </article>

        </section>

    </main>


    <footer class="footer">

        <div class="footer-bottom">

            <p>
                © 2026 Conciencia Histórica II.
                Proyecto educativo.
            </p>

        </div>

    </footer>

</body>

</html>
