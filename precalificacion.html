<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Califica nuestro proyecto | Conciencia Histórica II</title>

    <link rel="stylesheet" href="disenioPagina.css">

    <script src="js/app.js" defer></script>

</head>

<body>

    <header class="header">

        <nav class="navbar container">

            <a href="index.html" class="logo">
                <span class="logo-icon">H</span>
                <span>
                    CONCIENCIA
                    <small>HISTÓRICA II</small>
                </span>
            </a>

            <ul class="nav-links">

                <li>
                    <a href="index.html">Inicio</a>
                </li>

                <li>
                    <a href="MexicoConservador.html">
                        México conservador
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <main>

        <section class="form-section">

            <article class="form-card">

                <span class="section-tag">
                    TU OPINIÓN NOS IMPORTA
                </span>

                <h1>Califica nuestro proyecto</h1>

                <p>
                    Nos gustaría conocer tu opinión
                    sobre esta página de Conciencia Histórica II.
                </p>


                <div id="mensajeError"
                    class="alert alert-error"
                    role="alert">
                </div>

                <div id="mensajeExito"
                    class="alert alert-success"
                    role="status">
                </div>


                <form id="formCalificacion">

                    <div class="form-group">

                        <label for="calificacion">
                            ¿Qué calificación le das a nuestro proyecto?
                        </label>

                        <select
                            name="calificacion"
                            id="calificacion"
                            required>

                            <option value="">
                                Selecciona una calificación
                            </option>

                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="comentarios">
                            ¿Qué te pareció nuestra página?
                        </label>

                        <textarea
                            id="comentarios"
                            name="comentarios"
                            placeholder="Escribe tus comentarios..."
                            required></textarea>

                    </div>


                    <button type="submit">
                        Enviar calificación →
                    </button>

                </form>


                <br>

                <a href="index.html" class="text-link">
                    ← Volver al inicio
                </a>

            </article>

        </section>

    </main>


    <footer class="footer">

        <div class="footer-bottom">

            <p>
                © 2026 Conciencia Histórica II.
                Proyecto educativo.
            </p>

        </div>

    </footer>

</body>

</html>
